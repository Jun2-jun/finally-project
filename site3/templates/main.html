<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ELLEN VON WIEGAND</title>
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Work Sans', sans-serif;
      background-color: white;
      overflow-x: hidden;
    }

    header {
      width: 100%;
      padding: 80px 20px 60px;
      text-align: center;
      background: white;
      position: relative;
      z-index: 2;
    }

    .logo {
      font-size: 2rem;
      font-weight: 300;
      letter-spacing: 2px;
      margin-bottom: 35px;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 35px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    nav a {
      text-decoration: none;
      color: #666;
      font-weight: 300;
      font-size: 1rem;
    }

    .icons {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 1rem;
      color: #666;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hero {
      width: 100%;
      height: 70vh;
      background: url('/static/images/banner.jpg') no-repeat center center/cover;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .hero h1 {
      font-size: 4rem;
      color: white;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.4);
      line-height: 1.2;
      margin-bottom: 40px;
    }

    .hero a {
      text-decoration: none;
      color: white;
      font-weight: bold;
      font-size: 1.1rem;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.6);
    }

    .gallery {
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 0px 0 60px;
      background-color: white;
      margin-top: -600px;
    }

    .gallery img {
      max-width: 90%;
      height: auto;
      border-radius: 10px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">ELLEN VON WIEGAND</div>
    <nav>
      <a href="#">home</a>
      <a href="#">available art</a>
      <a href="#">print of the month</a>
      <a href="#">about me</a>
      <a href="#">contact</a>
      <a href="#">reflections</a>
    </nav>
    <div class="icons">
      <span>🛒</span>
      <span>👤 Log Out</span>
    </div>
  </header>

  <section class="hero">
  </section>

  <section class="gallery">
    <img src="/static/images/bg1.png" alt="Gallery Image">
  </section>
</body>
</html>
