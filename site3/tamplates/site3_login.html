<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Story</title>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login3.css') }}">
</head>
<body>
  <div class="container">
    <div class="left">
      <h1>Story</h1>
      <p>
       Shop smarter. Live better.<br />
        Welcome to your new favorite store.
      </p>
      <form method="POST" action="/login" class="login-form">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Sign In</button>
      </form>
    </div>
    <div class="right">
      <img src="{{ url_for('static', filename='images/mountain.avif') }}" alt="banner image">
    </div>
  </div>
</body>
</html>
