<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sign In</title>
  <link href="https://unpkg.com/boxicons@2.0.7/css/boxicons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login2.css') }}">
</head>
<body>

<div class="login">
  <div class="login__content">
    <div class="login__img">
      <img src="https://image.freepik.com/free-vector/code-typing-concept-illustration_114360-3581.jpg" alt="user login">
    </div>
    <div class="login__forms">

      <!-- Login Form -->
      <form method="POST" action="/login" class="login__register" id="login-in">
        <h1 class="login__title">Sign In</h1>
        <div class="login__box">
          <i class='bx bx-user login__icon'></i>
          <input type="text" name="username" placeholder="Username" class="login__input" required>
        </div>
        <div class="login__box">
          <i class='bx bx-lock login__icon'></i>
          <input type="password" name="password" placeholder="Password" class="login__input" required>
        </div>
        <a href="#" class="login__forgot">Forgot Password?</a>
        <button type="submit" class="login__button">Sign In</button>
        <div>
          <span class="login__account">Don't Have an Account?</span>
          <span class="login__signin" id="sign-up">Sign Up</span>
        </div>
      </form>

      <!-- Register Form -->
      <form action="#" class="login__create none" id="login-up">
        <h1 class="login__title">Create Account</h1>
        <div class="login__box">
          <i class='bx bx-user login__icon'></i>
          <input type="text" placeholder="Username" class="login__input">
        </div>
        <div class="login__box">
          <i class='bx bx-at login__icon'></i>
          <input type="text" placeholder="Email" class="login__input">
        </div>
        <div class="login__box">
          <i class='bx bx-lock login__icon'></i>
          <input type="password" placeholder="Password" class="login__input">
        </div>
        <a href="#" class="login__button">Sign Up</a>
        <div>
          <span class="login__account">Already have an Account?</span>
          <span class="login__signup" id="sign-in">Sign In</span>
        </div>
        <div class="login__social">
          <a href="#" class="login__social--icon"><i class='bx bxl-facebook'></i></a>
          <a href="#" class="login__social--icon"><i class='bx bxl-twitter'></i></a>
          <a href="#" class="login__social--icon"><i class='bx bxl-google'></i></a>
          <a href="#" class="login__social--icon"><i class='bx bxl-github'></i></a>
        </div>
      </form>

    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/login2.js') }}"></script>
</body>
</html>
